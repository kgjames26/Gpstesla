<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0d"><meta name="description" content="Carte satellite GPS minimaliste pour Tesla.">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/tesla-nav.svg" type="image/svg+xml">

<title>Tesla GPS</title>
</head>
<body>
<main class="screen"><div id="map" aria-label="Carte satellite GPS"></div><div class="map-shade" aria-hidden="true"></div>
<div class="vehicle" aria-hidden="true"><svg viewBox="0 0 120 240" role="presentation">

<ellipse cx="60" cy="126" rx="43" ry="102" fill="#000" opacity=".45" filter="url(#shadow)"/><g fill="#101316"><path d="M14 55Q7 55 7 64v28q0 8 7 8h5V55zm92 0q7 0 7 9v28q0 8-7 8h-5V55zM14 146q-7 0-7 8v27q0 8 7 8h5v-43zm92 0q7 0 7 8v27q0 8-7 8h-5v-43z"/></g>
<path d="M60 13c-12 0-21 8-27 21L20 64c-4 11-7 23-7 37v51c0 17 4 31 11 43l8 22c4 10 15 15 28 15s24-5 28-15l8-22c7-12 11-26 11-43v-51c0-14-3-26-7-37L87 34C81 21 72 13 60 13Z" fill="url(#body)" stroke="#f8fafb" stroke-width="2"/>
<path d="M60 25c-9 0-16 6-21 17l-8 19q29-9 58 0l-8-19C76 31 69 25 60 25Z" fill="url(#glass)" stroke="#7f8991" stroke-width="1.5"/><path d="M31 66q29-10 58 0l5 23q-34-8-68 0z" fill="url(#glass)" stroke="#737d85" stroke-width="1.4"/><path d="M27 100q33-7 66 0v39q-33 8-66 0z" fill="url(#glass)" stroke="#7c858d" stroke-width="1.5"/><path d="M28 145q32 8 64 0v20q0 12-7 21l-7 10H42l-7-10q-7-9-7-21z" fill="url(#glass)" stroke="#7c858d" stroke-width="1.5"/><path d="M34 186h52l-4 10q-3 9-11 12H49q-8-3-11-12z" fill="#b9c0c5" stroke="#f8fafb" stroke-width="1.2"/>
<path d="M20 72q6-4 12-4v17q-7 1-13 4zm80-4q6 0 12 4l1 17q-6-3-13-4z" fill="#e9f5ff"/><path d="M20 165q6 4 12 4v12q-7-1-13-4zm80 4q6 0 12-4l1 12q-6 3-13 4z" fill="#f34b4b"/><path d="M60 15v5m-4 3h8" stroke="#777f86" stroke-width="1.5" stroke-linecap="round"/><path d="M42 100v38m36-38v38M42 145v24m36-24v24" stroke="#a8b1b8" stroke-opacity=".6"/></svg></div>
<section class="speed" aria-label="Vitesse GPS"><strong id="speed">0</strong><span>km/h</span></section>
<div id="gps-status" class="gps-status searching" role="status" aria-label="Recherche du signal GPS"></div>
